---
# -----------------------------------------------
# ----  Copier Setting  -------------------------
# -----------------------------------------------

_envops:
  trim_blocks: true   # drop the first newline after a block
  lstrip_blocks: true # drop leading spaces & tabs before a block

_exclude:
  - copier.yaml
  - .git
  - .github
  - LICENSE
  - README.md

# -----------------------------------------------
# ----  Project  --------------------------------
# -----------------------------------------------

project_name:
  help: What is your project name?
  type: str

project_description:
  help: Describe what the project is about
  type: str

project_license:
  help: What license should the project have?
  type: str
  # ref: https://spdx.org/licenses
  #      https://github.com/spdx/license-list-data/tree/main
  choices:
    None: ''
    # ref: https://spdx.org/licenses/MIT.html
    #      https://github.com/spdx/license-list-data/blob/main/text/MIT.txt
    MIT: MIT
    # ref: https://spdx.org/licenses/GPL-3.0-only.html
    #      https://github.com/spdx/license-list-data/blob/main/text/GPL-3.0-only.txt
    GPL-3.0-only: GPL-3.0-only
    # ref: https://spdx.org/licenses/GPL-3.0-or-later.html
    #      https://github.com/spdx/license-list-data/blob/main/text/GPL-3.0-or-later.txt
    GPL-3.0-or-later: GPL-3.0-or-later
  default: GPL-3.0-or-later

project_copyright_year:
  default: "{{ project_copyright_year | default('%Y' | strftime) }}"
  type: str
  when: false

project_changelog_enabled:
  help: You want to have a changelog?
  type: bool
  default: true

# -----------------------------------------------
# ----  Languages  ------------------------------
# -----------------------------------------------

lang_python_enabled:
  help: Will the project contain Python?
  type: bool

lang_shell_enabled:
  help: Will the project contain shell (scripts)?
  type: bool
  default: false

lang_shell_type:
  help: Which shell will the project target?
  type: str
  when: '{{ lang_shell_enabled }}'
  choices:
    sh: sh
    bash: bash
    zsh: zsh
    fish: fish
  default: bash

lang_rust_enabled:
  help: Will the project contain Rust?
  type: bool
  default: false

# -----------------------------------------------
# ----  Git  ------------------------------------
# -----------------------------------------------

git_ecosystem:
  help: Which Git ecosystem will your project use?
  type: str
  choices:
    none: ''
    github: github
  default: ''

# -----------------------------------------------
# ----  Dev Container  --------------------------
# -----------------------------------------------

dev_container_enabled:
  help: Should the project have a Development Container?
  type: bool
  default: false

dev_container_use_hermes:
  help: Would you like to use use hermes (https://github.com/georglauterbach/hermes) in the Development Container (as a Development Container Feature)?
  type: bool
  when: '{{ dev_container_enabled }}'
